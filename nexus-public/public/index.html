<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXUS AI</title><style>body{margin:0;background:#070b13;color:#edf3ff;font:15px system-ui}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.side{padding:14px;border-right:1px solid #1e2b42;background:#0a101c}.brand{font-weight:900;letter-spacing:.15em;margin:12px}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#8fa0ba;padding:11px;border-radius:10px}.nav .on{background:#131d31;color:white}.main{min-width:0}.top{height:62px;border-bottom:1px solid #1e2b42;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.content{padding:16px;max-width:1050px;margin:auto}.card{background:#0e1626;border:1px solid #22314b;border-radius:16px;padding:15px;margin-bottom:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #40557d;background:#6d7fff;padding:10px 13px;border-radius:10px;font-weight:800;color:white}.secondary{background:#142039}input,textarea,select{width:100%;background:#09111e;border:1px solid #22314b;color:white;padding:12px;border-radius:10px;box-sizing:border-box;margin:6px 0}textarea{min-height:95px}.msg{max-width:82%;padding:12px;background:#0e1626;border:1px solid #22314b;border-radius:14px;white-space:pre-wrap;margin:8px 0}.user{margin-left:auto;background:#202d55}.muted{color:#91a1bb;font-size:13px}.source{display:block;color:#9eb3ff;font-size:12px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{max-width:100%;border-radius:12px}.menu{display:none}@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:fixed;left:-230px;top:0;bottom:0;width:200px;z-index:5;transition:.2s}.side.open{left:0}.menu{display:block}.grid{grid-template-columns:1fr}.content{padding:10px}}</style><body><div class="app"><aside class="side" id="side"><div class="brand">NEXUS AI</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div class="row"><button class="btn secondary menu" id="menu">☰</button><b id="title">Chat</b></div><span class="muted" id="status">...</span></div><section class="content" id="content"></section></main></div><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let view='chat',study=false,speak=true,voice='default',msgs=JSON.parse(localStorage.nexusChat||'[]'),sett={};const P=[['chat','✦ Chat'],['research','⌕ Pesquisar'],['image','▧ Imagens'],['video','▶ Vídeos'],['voice','◉ Voice'],['builder','◇ Builder'],['agents','◎ Mini IAs'],['study','▤ Modo Estudo'],['daily','✓ Cotidiano'],['admin','♜ Admin'],['settings','⚙ Configurações']],VP={default:[1,1],Luna:[.94,1.18],Nova:[1.16,1.24],Iris:[.9,1.1],Atlas:[.82,.62],Orion:[.98,.78],Kael:[1.08,.68],Sage:[.86,.94],Echo:[1.22,1.02]};async function api(u,o={}){let k=sessionStorage.nexusAdmin||'',r=await fetch(u,{headers:{'content-type':'application/json',...(k?{'x-nexus-admin':k}:{})},...o}),j=await r.json().catch(()=>({error:'Resposta inválida'}));if(r.status===401){k=prompt('Senha Admin:');if(k){sessionStorage.nexusAdmin=k;return api(u,o)}}if(!r.ok)throw Error(j.error||'Falha');return j}function navf(){nav.innerHTML=P.map(p=>'<button class="'+(view===p[0]?'on':'')+'" data-v="'+p[0]+'">'+p[1]+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;side.classList.remove('open');navf();render()})}menu.onclick=()=>side.classList.toggle('open');function save(){localStorage.nexusChat=JSON.stringify(msgs.slice(-50))}function say(t){if(!speak||!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t.slice(0,3500)),p=VP[voice]||VP.default;u.rate=p[0];u.pitch=p[1];let vs=speechSynthesis.getVoices();if(vs.length)u.voice=vs[(Object.keys(VP).indexOf(voice)+vs.length)%vs.length];speechSynthesis.speak(u)}function render(){({chat,research,image,video,voicePage,builder,agents,studyPage,daily,admin,settingsPage}[view]||chat)()}function chat(){title.textContent='Chat';content.innerHTML='<div class="card row"><button id="st" class="btn secondary">📚 Estudo '+(study?'ON':'OFF')+'</button><button id="sp" class="btn secondary">🔊 Voz '+(speak?'ON':'OFF')+'</button></div><div id="box"></div><textarea id="q" placeholder="Pergunte qualquer coisa..."></textarea><div class="row"><label class="muted"><input id="ver" type="checkbox" checked style="width:auto"> pesquisar + verificar</label><button id="send" class="btn">Enviar</button></div>';draw();st.onclick=()=>{study=!study;chat()};sp.onclick=()=>{speak=!speak;chat()};send.onclick=go;q.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}}}function draw(){box.innerHTML=msgs.length?msgs.map(m=>'<div class="msg '+(m.role==='user'?'user':'')+'">'+esc(m.content)+(m.sources||[]).map(s=>'<a class="source" target="_blank" href="'+esc(s.url)+'">↗ '+esc(s.title)+'</a>').join('')+'</div>').join(''):'<div class="card"><h2>Olá, eu sou a NEXUS.</h2><p class="muted">Chat, pesquisa, imagens, estudo, Builder, Mini IAs, voz e cotidiano.</p></div>'}async function go(){let t=q.value.trim();if(!t)return;msgs.push({role:'user',content:t});q.value='';draw();send.disabled=true;try{let j=await api('/api/chat',{method:'POST',body:JSON.stringify({messages:msgs.map(x=>({role:x.role,content:x.content})),study,verify:ver.checked})});msgs.push({role:'assistant',content:j.text,sources:j.sources});save();draw();say(j.text)}catch(e){msgs.push({role:'assistant',content:'Erro: '+e.message});draw()}finally{send.disabled=false}}function research(){title.textContent='Pesquisar';content.innerHTML='<div class="card"><input id="rq" placeholder="Pesquisar"><button id="rb" class="btn">Pesquisar</button><div id="rr"></div></div>';rb.onclick=async()=>{rr.textContent='Pesquisando...';let j=await api('/api/research',{method:'POST',body:JSON.stringify({query:rq.value})});rr.innerHTML=j.results.map(x=>'<div class="card"><b>'+esc(x.title)+'</b><p class="muted">'+esc(x.content)+'</p><a class="source" target="_blank" href="'+esc(x.url)+'">'+esc(x.url)+'</a></div>').join('')||'Nenhuma fonte respondeu.'}}function image(){title.textContent='Imagens';content.innerHTML='<div class="grid"><div class="card"><textarea id="ip" placeholder="Descreva a imagem"></textarea><button id="ib" class="btn">Gerar</button></div><div class="card" id="io">Nenhuma imagem.</div></div>';ib.onclick=async()=>{io.textContent='Gerando...';let j=await api('/api/image',{method:'POST',body:JSON.stringify({prompt:ip.value})});io.innerHTML='<img class="preview" src="'+esc(j.url)+'"><a class="source" target="_blank" href="'+esc(j.url)+'">Abrir</a>'}}function video(){title.textContent='Vídeos';content.innerHTML='<div class="grid"><div class="card"><textarea id="vp" placeholder="Descreva o vídeo"></textarea><button id="vb" class="btn">Gerar</button></div><div class="card" id="vo">Só exibimos vídeo real retornado pelo provedor.</div></div>';vb.onclick=async()=>{try{let j=await api('/api/video',{method:'POST',body:JSON.stringify({prompt:vp.value})});vo.innerHTML='<video class="preview" controls src="'+esc(j.url)+'"></video>'}catch(e){vo.textContent=e.message}}}function voicePage(){title.textContent='Voice';content.innerHTML='<div class="card"><div class="row">'+Object.keys(VP).map(v=>'<button class="btn secondary" data-x="'+v+'">'+v+'</button>').join('')+'</div><textarea id="vt">Olá! Eu sou a NEXUS.</textarea><button id="vs" class="btn">Ouvir</button></div>';content.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{voice=b.dataset.x;say(vt.value)});vs.onclick=()=>say(vt.value)}function builder(){title.textContent='Builder';content.innerHTML='<div class="card"><textarea id="bp" placeholder="Crie um app, bot ou projeto..."></textarea><button id="bb" class="btn">Criar</button><pre id="bo"></pre></div>';bb.onclick=async()=>{bo.textContent=JSON.stringify(await api('/api/builder',{method:'POST',body:JSON.stringify({prompt:bp.value})}),null,2)}}async function agents(){title.textContent='Mini IAs';let j=await api('/api/agents');content.innerHTML='<div class="card"><input id="an" placeholder="Nome"><input id="ag" placeholder="Objetivo"><button id="ab" class="btn">Criar</button></div>'+j.agents.map(a=>'<div class="card"><b>'+esc(a.name)+'</b><p>'+esc(a.goal)+'</p><button class="btn secondary del" data-id="'+a.id+'">Excluir</button></div>').join('');ab.onclick=async()=>{await api('/api/agents',{method:'POST',body:JSON.stringify({name:an.value,goal:ag.value})});agents()};content.querySelectorAll('.del').forEach(b=>b.onclick=async()=>{await api('/api/agents/'+b.dataset.id,{method:'DELETE'});agents()})}function studyPage(){title.textContent='Modo Estudo';content.innerHTML='<div class="card"><button id="tog" class="btn">'+(study?'Desativar':'Ativar')+'</button><p class="muted">Ativo: lição passo a passo + quiz ao final.</p></div>';tog.onclick=()=>{study=!study;studyPage()}}function daily(){title.textContent='Cotidiano';let a=JSON.parse(localStorage.tasks||'[]');content.innerHTML='<div class="card"><input id="task" placeholder="Nova tarefa"><button id="add" class="btn">Adicionar</button></div>'+a.map((x,i)=>'<div class="card row"><span style="flex:1">'+esc(x)+'</span><button data-i="'+i+'" class="btn secondary">✓</button></div>').join('');add.onclick=()=>{if(task.value.trim()){a.push(task.value.trim());localStorage.tasks=JSON.stringify(a);daily()}};content.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{a.splice(+b.dataset.i,1);localStorage.tasks=JSON.stringify(a);daily()})}async function admin(){title.textContent='Admin';content.innerHTML='<div class="card" id="ao">Carregando...</div>';try{ao.innerHTML='<pre>'+esc(JSON.stringify(await api('/api/admin'),null,2))+'</pre>'}catch(e){ao.textContent=e.message}}async function settingsPage(){title.textContent='Configurações';let j=await api('/api/status');sett=j.settings;content.innerHTML='<div class="card"><h3>Chat</h3><select id="lp"><option value="pollinations">Pollinations sem chave</option><option value="openai">OpenAI-compatible</option></select><input id="lu" value="'+esc(sett.llmBaseUrl||'')+'" placeholder="Base URL"><input id="lm" value="'+esc(sett.llmModel||'')+'" placeholder="Modelo"><input id="lk" type="password" placeholder="API key"><h3>Imagem</h3><select id="ip"><option value="pollinations">Pollinations</option><option value="openai">OpenAI-compatible</option></select><input id="iu" value="'+esc(sett.imageBaseUrl||'')+'"><input id="im" value="'+esc(sett.imageModel||'')+'"><input id="ik" type="password" placeholder="API key"><h3>Vídeo</h3><input id="vu" value="'+esc(sett.videoUrl||'')+'" placeholder="Endpoint"><input id="vm" value="'+esc(sett.videoModel||'')+'" placeholder="Modelo"><input id="vk" type="password" placeholder="API key"><button id="sv" class="btn">Salvar</button></div>';lp.value=sett.llmProvider;ip.value=sett.imageProvider;sv.onclick=async()=>{await api('/api/settings',{method:'POST',body:JSON.stringify({llmProvider:lp.value,llmBaseUrl:lu.value,llmModel:lm.value,llmApiKey:lk.value,imageProvider:ip.value,imageBaseUrl:iu.value,imageModel:im.value,imageApiKey:ik.value,videoUrl:vu.value,videoModel:vm.value,videoApiKey:vk.value})});alert('Salvo')}}async function boot(){navf();render();try{let j=await api('/api/status');status.textContent='online · '+j.version}catch{status.textContent='offline'}}boot();
</script></body></html>
